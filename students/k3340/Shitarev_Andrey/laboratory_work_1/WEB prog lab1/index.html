<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать</title>
    <style>
        /* Общие стили и сброс настроек */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            overflow: hidden;
        }

        /* Контейнер-карточка */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1.2s ease-out;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Аватар / Иконка */
        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }

        /* Текст */
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #2d3748;
        }

        p {
            font-size: 1rem;
            color: #718096;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Кнопки/Ссылки */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            text-decoration: none;
            color: white;
            background: #4a5568;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #2d3748;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
        }

        .btn.primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }

        .btn.primary:hover {
            background: linear-gradient(45deg, #5a6fd6, #694393);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Вместо букв можно вставить картинку: <img src="avatar.jpg" alt="Avatar"> -->
        <div class="avatar">Привет</div>
        
        <h1>Рад видеть вас здесь!</h1>
        <p>Это простая, но элегантная веб-страница. Вы можете легко изменить этот текст, добавить свои ссылки или использовать её как основу для будущего проекта.</p>
        
        <div class="links">
            <a href="#" class="btn primary">Моё портфолио</a>
            <a href="#" class="btn">Связаться со мной</a>
        </div>
    </div>

</body>
</html>
